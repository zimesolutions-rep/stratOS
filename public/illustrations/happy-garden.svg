<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A garden at sunrise: a gardener waters three sunflowers growing taller, while a couple share tea on a bench under a rose arch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE4FF"/><stop offset="0.48" stop-color="#FBEAF4"/><stop offset="0.68" stop-color="#FFEBD8"/><stop offset="1" stop-color="#FFF4E3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.9"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDB8F2"/><stop offset="1" stop-color="#E3D6FA"/></linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9DFC2"/><stop offset="1" stop-color="#93D4B2"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86CFA6"/><stop offset="1" stop-color="#5FB98A"/></linearGradient>
  </defs>

  <rect width="760" height="920" fill="url(#sky)"/>

  <!-- rising sun -->
  <circle cx="560" cy="560" r="170" fill="url(#glow)"/>
  <circle cx="560" cy="560" r="64" fill="#FFC857"/>
  <g stroke="#FFC857" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M560 470 v-26"/><path d="M490 500 l-18 -18"/><path d="M630 500 l18 -18"/><path d="M465 560 h-26"/><path d="M655 560 h26"/>
  </g>

  <!-- clouds and birds -->
  <g fill="#FFFFFF">
    <g opacity="0.95"><ellipse cx="170" cy="400" rx="50" ry="15"/><ellipse cx="200" cy="388" rx="30" ry="20"/><ellipse cx="146" cy="392" rx="22" ry="13"/></g>
    <g opacity="0.85"><ellipse cx="660" cy="420" rx="38" ry="11"/><ellipse cx="682" cy="411" rx="22" ry="14"/></g>
  </g>
  <g fill="none" stroke="#6B5B9A" stroke-width="2.4" stroke-linecap="round">
    <path d="M330 440 q8 -8 16 0 q8 -8 16 0"/><path d="M376 420 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- hills -->
  <path d="M0 600 C 140 548 260 560 380 584 C 500 606 620 556 760 566 L760 920 L0 920 Z" fill="url(#hillFar)"/>
  <path d="M0 640 C 150 606 300 618 420 636 C 560 656 660 618 760 624 L760 920 L0 920 Z" fill="url(#hillMid)"/>
  <!-- greenhouse on the hill -->
  <g transform="translate(600 584)">
    <path d="M0 40 V14 Q34 -14 68 14 V40 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M0 40 V14 Q34 -14 68 14 V40 M22 40 V2 M46 40 V2 M0 22 H68" fill="none" stroke="#7A2EDB" stroke-width="2.4"/>
  </g>
  <g><rect x="70" y="600" width="6" height="22" fill="#8A6A4A"/><circle cx="73" cy="592" r="18" fill="#5DB487"/></g>

  <!-- lawn -->
  <path d="M0 690 C 180 664 340 670 480 684 C 600 696 690 676 760 680 L760 920 L0 920 Z" fill="url(#lawn)"/>

  <!-- path -->
  <path d="M300 920 C 330 840 360 780 330 740 C 310 714 300 700 318 688 L 352 688 C 340 704 352 718 376 742 C 416 784 410 850 420 920 Z" fill="#F6E9D3"/>
  <g fill="#E9D5B4"><ellipse cx="360" cy="880" rx="20" ry="6"/><ellipse cx="370" cy="820" rx="16" ry="5"/><ellipse cx="358" cy="768" rx="13" ry="4"/></g>

  <!-- rose arch -->
  <g transform="translate(286 560)">
    <path d="M6 132 V52 Q50 -6 94 52 V132" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M6 132 V52 Q50 -6 94 52 V132" fill="none" stroke="#5DB487" stroke-width="3" stroke-dasharray="10 8"/>
    <g fill="#4FA87B"><circle cx="8" cy="70" r="9"/><circle cx="20" cy="36" r="10"/><circle cx="50" cy="20" r="11"/><circle cx="80" cy="36" r="10"/><circle cx="92" cy="70" r="9"/><circle cx="6" cy="104" r="8"/><circle cx="94" cy="104" r="8"/></g>
    <g fill="#FF8FB1"><circle cx="16" cy="44" r="5"/><circle cx="44" cy="18" r="5"/><circle cx="62" cy="22" r="4.5"/><circle cx="86" cy="46" r="5"/><circle cx="6" cy="84" r="4.5"/><circle cx="96" cy="88" r="4.5"/></g>
    <g fill="#7A2EDB"><circle cx="30" cy="26" r="3.5"/><circle cx="76" cy="28" r="3.5"/><circle cx="92" cy="60" r="3"/></g>
  </g>

  <!-- tree with blossoms, left -->
  <g>
    <path d="M86 820 C 90 770 84 730 78 700 L 100 700 C 102 740 108 780 112 820 Z" fill="#8A6A4A"/>
    <circle cx="70" cy="650" r="58" fill="#6DC196"/><circle cx="130" cy="672" r="48" fill="#5DB487"/><circle cx="96" cy="610" r="44" fill="#86CFA6"/><circle cx="30" cy="690" r="38" fill="#5DB487"/>
    <g fill="#FFFFFF" opacity="0.9"><circle cx="60" cy="620" r="4"/><circle cx="110" cy="640" r="4"/><circle cx="142" cy="676" r="4"/><circle cx="40" cy="676" r="4"/><circle cx="88" cy="690" r="4"/></g>
  </g>

  <!-- bench with a couple sharing tea -->
  <g transform="translate(120 740)">
    <rect x="0" y="40" width="150" height="10" rx="4" fill="#B98552"/>
    <rect x="0" y="14" width="150" height="9" rx="4" fill="#B98552"/><rect x="0" y="27" width="150" height="7" rx="3" fill="#B98552"/>
    <rect x="12" y="50" width="7" height="30" rx="2" fill="#8A6A4A"/><rect x="131" y="50" width="7" height="30" rx="2" fill="#8A6A4A"/>
    <!-- person 1 -->
    <circle cx="44" cy="-14" r="13" fill="#B97A57"/><path d="M31 -18 Q44 -36 57 -18 Q50 -26 44 -24 Q38 -26 31 -18 Z" fill="#E7E2EE"/>
    <rect x="30" y="0" width="30" height="42" rx="11" fill="#7A2EDB"/>
    <rect x="34" y="38" width="34" height="11" rx="5" fill="#3A2F5C"/><rect x="60" y="40" width="9" height="34" rx="4" fill="#3A2F5C"/>
    <!-- person 2 -->
    <circle cx="96" cy="-12" r="13" fill="#8C5A3C"/><path d="M83 -16 Q96 -34 109 -16 L109 -6 Q104 -20 96 -22 Q88 -20 83 -6 Z" fill="#2F2A3A"/>
    <rect x="82" y="2" width="30" height="40" rx="11" fill="#FF8FB1"/>
    <rect x="76" y="38" width="34" height="11" rx="5" fill="#5B4B8A"/><rect x="76" y="40" width="9" height="34" rx="4" fill="#5B4B8A"/>
    <!-- cups -->
    <rect x="62" y="10" width="10" height="11" rx="2" fill="#FFFFFF"/><rect x="80" y="12" width="10" height="11" rx="2" fill="#FFFFFF"/>
    <path d="M66 6 q3 -5 0 -9 M84 8 q3 -5 0 -9" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <!-- cat -->
    <g transform="translate(150 64)"><ellipse cx="14" cy="10" rx="16" ry="9" fill="#F4A259"/><circle cx="30" cy="2" r="7" fill="#F4A259"/><path d="M26 -3 l2 -6 l3 5 M32 -4 l3 -5 l1 6" fill="#F4A259"/><path d="M-2 8 q-10 -12 -2 -18" fill="none" stroke="#F4A259" stroke-width="4" stroke-linecap="round"/></g>
  </g>

  <!-- raised bed with three sunflowers growing taller (the StratOS bars) -->
  <g transform="translate(470 650)">
    <!-- stems -->
    <path d="M40 170 V112" stroke="#4FA87B" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 170 V72" stroke="#4FA87B" stroke-width="6" stroke-linecap="round"/>
    <path d="M160 170 V26" stroke="#4FA87B" stroke-width="6" stroke-linecap="round"/>
    <g fill="#5DB487">
      <path d="M40 142 q-18 -6 -22 -20 q16 0 22 14 Z"/><path d="M100 130 q20 -6 24 -22 q-18 0 -24 16 Z"/><path d="M100 100 q-18 -6 -22 -20 q16 0 22 14 Z"/>
      <path d="M160 120 q20 -6 24 -22 q-18 0 -24 16 Z"/><path d="M160 80 q-20 -6 -24 -22 q18 0 24 16 Z"/>
    </g>
    <!-- heads -->
    <g><circle cx="40" cy="104" r="20" fill="#FFC857"/><circle cx="40" cy="104" r="9" fill="#8A5A2B"/></g>
    <g><circle cx="100" cy="62" r="24" fill="#FFC857"/><circle cx="100" cy="62" r="11" fill="#8A5A2B"/></g>
    <g><circle cx="160" cy="14" r="28" fill="#FFC857"/><circle cx="160" cy="14" r="13" fill="#8A5A2B"/></g>
    <g fill="#F5A524"><circle cx="40" cy="84" r="5"/><circle cx="58" cy="98" r="5"/><circle cx="22" cy="98" r="5"/><circle cx="100" cy="38" r="6"/><circle cx="122" cy="54" r="6"/><circle cx="78" cy="54" r="6"/><circle cx="160" cy="-14" r="7"/><circle cx="186" cy="4" r="7"/><circle cx="134" cy="4" r="7"/></g>
    <!-- the bed -->
    <rect x="0" y="160" width="200" height="44" rx="6" fill="#B98552"/>
    <rect x="0" y="160" width="200" height="10" rx="4" fill="#8A6A4A"/>
    <path d="M66 172 V204 M134 172 V204" stroke="#A97645" stroke-width="3"/>
  </g>

  <!-- gardener watering -->
  <g transform="translate(410 724)">
    <circle cx="22" cy="0" r="14" fill="#B97A57"/>
    <path d="M6 -2 Q8 -22 24 -20 Q40 -18 38 0 L 30 -6 Q22 -12 12 -6 Z" fill="#2F2A3A"/>
    <path d="M2 -10 Q22 -30 44 -10 Z" fill="#F5A524"/><rect x="-6" y="-12" width="56" height="5" rx="2.5" fill="#F5A524"/>
    <rect x="6" y="16" width="34" height="50" rx="12" fill="#7A2EDB"/>
    <rect x="8" y="62" width="11" height="44" rx="5" fill="#3A2F5C"/><rect x="27" y="62" width="11" height="44" rx="5" fill="#3A2F5C"/>
    <rect x="4" y="102" width="17" height="7" rx="3" fill="#2F2A3A"/><rect x="25" y="102" width="17" height="7" rx="3" fill="#2F2A3A"/>
    <!-- arm and can -->
    <path d="M36 28 L58 40" stroke="#7A2EDB" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(52 30)">
      <rect x="0" y="6" width="30" height="24" rx="6" fill="#5B8DEF"/>
      <path d="M28 12 L52 -2 L54 2 L32 18 Z" fill="#5B8DEF"/>
      <path d="M4 6 Q15 -8 26 6" fill="none" stroke="#5B8DEF" stroke-width="4"/>
    </g>
    <g fill="#8EC5FF"><circle cx="112" cy="30" r="3"/><circle cx="120" cy="40" r="2.6"/><circle cx="114" cy="48" r="2.4"/><circle cx="124" cy="54" r="2.2"/></g>
  </g>

  <!-- butterflies -->
  <g transform="translate(600 610)"><path d="M0 0 q-12 -14 -18 -2 q4 10 18 2 q12 -14 18 -2 q-4 10 -18 2" fill="#C9A7FF"/></g>
  <g transform="translate(240 600) scale(0.8)"><path d="M0 0 q-12 -14 -18 -2 q4 10 18 2 q12 -14 18 -2 q-4 10 -18 2" fill="#FF8FB1"/></g>

  <!-- foreground flowers -->
  <g>
    <g stroke="#4FA87B" stroke-width="3" stroke-linecap="round">
      <path d="M30 920 V872"/><path d="M60 920 V884"/><path d="M96 920 V866"/><path d="M200 920 V880"/><path d="M236 920 V870"/>
      <path d="M470 920 V880"/><path d="M510 920 V868"/><path d="M640 920 V876"/><path d="M680 920 V864"/><path d="M720 920 V882"/>
    </g>
    <g fill="#FF8FB1"><path d="M22 872 q8 -18 16 0 q-8 6 -16 0"/><path d="M228 870 q8 -18 16 0 q-8 6 -16 0"/><path d="M672 864 q8 -18 16 0 q-8 6 -16 0"/></g>
    <g fill="#7A2EDB"><path d="M52 884 q8 -18 16 0 q-8 6 -16 0"/><path d="M502 868 q8 -18 16 0 q-8 6 -16 0"/><path d="M712 882 q8 -18 16 0 q-8 6 -16 0"/></g>
    <g fill="#FFC857"><circle cx="96" cy="864" r="7"/><circle cx="200" cy="878" r="6"/><circle cx="470" cy="878" r="6"/><circle cx="640" cy="874" r="7"/></g>
  </g>
</svg>
